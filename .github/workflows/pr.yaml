name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-builder:
    needs:
      - build-details
      - check-nightly-ci
      - changed-files
      - checks
      - cmake-tests
      - conda-cpp-build
      - conda-cpp-tests
      - conda-cpp-debug-tests
      - conda-python-build
      - conda-python-tests
      - conda-python-tests-integration-optional
      - docs-build
      - docs-build-matrix
      - publish-api-docs
      - wheel-build-cpp
      - wheel-build-python
      - wheel-tests
      - wheel-tests-integration-optional
      - devcontainer
      - telemetry-setup
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    if: false
    with:
      needs: ${{ toJSON(needs) }}
  telemetry-setup:
    if: false
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    env:
      OTEL_SERVICE_NAME: "pr-rmm"
    steps:
      - name: Telemetry setup
        # This gate is here and not at the job level because we need the job to not be skipped,
        # since other jobs depend on it.
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-base-env-vars@main
  build-details:
    if: false
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  check-nightly-ci:
    if: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get PR Info
        id: get-pr-info
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main
      - name: Check if nightly CI is passing
        uses: rapidsai/shared-actions/check_nightly_success/dispatch@main
        with:
          repo: ${{ github.repository }}
          target-branch: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).base.ref }}
  changed-files:
    needs:
      - telemetry-setup
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/changed-files.yaml@main
    with:
      files_yaml: |
        build_docs:
          - '**'
          - '!AGENTS.md'
          - '!SECURITY.md'
          - '!**/*/REVIEW_GUIDELINES.md'
          - '!.coderabbit.yaml'
          - '!.devcontainer/**'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/PULL_REQUEST_TEMPLATE.md'
          - '!.github/release.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/new-issues-to-triage-projects.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.github/zizmor.yml'
          - '!.pre-commit-config.yaml'
          - '!.shellcheckrc'
          - '!.yamllint.yaml'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/check_symbols.sh'
          - '!ci/release/update-version.sh'
          - '!ci/test_wheel.sh'
          - '!ci/validate_wheel.sh'
        test_cpp:
          - '**'
          - '!AGENTS.md'
          - '!**/*/REVIEW_GUIDELINES.md'
          - '!.coderabbit.yaml'
          - '!.devcontainer/**'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/PULL_REQUEST_TEMPLATE.md'
          - '!.github/release.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/new-issues-to-triage-projects.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.github/zizmor.yml'
          - '!.pre-commit-config.yaml'
          - '!.shellcheckrc'
          - '!.yamllint.yaml'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_docs.sh'
          - '!ci/build_python.sh'
          - '!ci/build_wheel*.sh'
          - '!ci/release/update-version.sh'
          - '!ci/run_pytests.sh'
          - '!ci/test_python.sh'
          - '!ci/test_wheel.sh'
          - '!ci/validate_wheel.sh'
          - '!docs/**'
          - '!img/**'
          - '!python/**'
        test_python_conda:
          - '**'
          - '!AGENTS.md'
          - '!**/*/REVIEW_GUIDELINES.md'
          - '!.coderabbit.yaml'
          - '!.devcontainer/**'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/PULL_REQUEST_TEMPLATE.md'
          - '!.github/release.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/new-issues-to-triage-projects.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.github/zizmor.yml'
          - '!.pre-commit-config.yaml'
          - '!.shellcheckrc'
          - '!.yamllint.yaml'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/test_wheel.sh'
          - '!ci/test_wheel_integrations.sh'
          - '!ci/validate_wheel.sh'
          - '!cpp/.clang-tidy'
          - '!cpp/doxygen/**'
          - '!docs/**'
          - '!img/**'
        test_python_wheels:
          - '**'
          - '!AGENTS.md'
          - '!**/*/REVIEW_GUIDELINES.md'
          - '!.coderabbit.yaml'
          - '!.devcontainer/**'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/PULL_REQUEST_TEMPLATE.md'
          - '!.github/release.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/new-issues-to-triage-projects.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.github/zizmor.yml'
          - '!.pre-commit-config.yaml'
          - '!.shellcheckrc'
          - '!.yamllint.yaml'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_cpp.sh'
          - '!ci/build_docs.sh'
          - '!ci/build_python.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/test_cpp.sh'
          - '!ci/test_cpp_debug.sh'
          - '!ci/test_python.sh'
          - '!ci/test_python_integrations.sh'
          - '!conda/**'
          - '!cpp/.clang-tidy'
          - '!cpp/doxygen/**'
          - '!docs/**'
          - '!img/**'
  checks:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    needs:
      - telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/checks.yaml@main
    with:
      enable_check_generated_files: false
      ignored_pr_jobs: "telemetry-summarize conda-python-tests-integration-optional wheel-tests-integration-optional"
  cmake-tests:
    needs: checks
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    with:
      build_type: pull-request
      node_type: cpu16
      arch: "amd64"
      container_image: "rapidsai/ci-conda:26.12-latest"
      script: "ci/test_cmake.sh"
  conda-cpp-build:
    needs: [build-details, checks]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu8
      script: ci/build_cpp.sh
  conda-cpp-tests:
    needs: [conda-cpp-build, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp
    with:
      build_type: pull-request
      script: ci/test_cpp.sh
  conda-cpp-debug-tests:
    needs: [checks, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp
    with:
      build_type: pull-request
      node_type: "gpu-rtxpro6000-latest-1"
      arch: "amd64"
      container_image: "rapidsai/ci-conda:26.12-latest"
      script: "ci/test_cpp_debug.sh"
  conda-python-build:
    needs: [build-details, conda-cpp-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      script: ci/build_python.sh
      # Build a conda package for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
  conda-python-tests:
    needs: [conda-python-build, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_conda
    with:
      build_type: pull-request
      script: ci/test_python.sh
  conda-python-tests-integration-optional:
    needs: [conda-python-build, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_conda
    with:
      build_type: pull-request
      script: ci/test_python_integrations.sh
  docs-build-matrix:
    if: false
    permissions:
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@main
    with:
      build_type: pull-request
      matrix_name: docs-build
  docs-build:
    needs: [docs-build-matrix, conda-python-build, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.docs-build-matrix.outputs.matrix) }}
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).build_docs
    with:
      build_type: pull-request
      node_type: "gpu-${{ matrix.GPU }}-${{ matrix.DRIVER }}-1"
      arch: "${{ matrix.arch }}"
      container_image: "rapidsai/ci-conda:26.12-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      script: "ci/build_docs.sh"
  publish-api-docs:
    if: github.ref_type == 'branch'
    needs: [docs-build]
    permissions:
      contents: read
      id-token: write
    secrets:
      akamai-access-token: ${{ secrets.NVIDIA_DOCS_AKAMAI_ACCESS_TOKEN }}
      akamai-client-token: ${{ secrets.NVIDIA_DOCS_AKAMAI_CLIENT_TOKEN }}
      akamai-client-secret: ${{ secrets.NVIDIA_DOCS_AKAMAI_CLIENT_SECRET }}
      akamai-emails-to-notify: ${{ secrets.NVIDIA_DOCS_AKAMAI_EMAILS_TO_NOTIFY }}
      akamai-host: ${{ secrets.NVIDIA_DOCS_AKAMAI_HOST }}
      target-aws-access-key-id: ${{ secrets.NVIDIA_DOCS_AWS_ACCESS_KEY_ID }}
      target-aws-region: ${{ secrets.NVIDIA_DOCS_AWS_REGION }}
      target-aws-secret-access-key: ${{ secrets.NVIDIA_DOCS_AWS_SECRET_ACCESS_KEY }}
      target-archive-s3-bucket: ${{ secrets.NVIDIA_DOCS_ARCHIVE_S3_BUCKET }}
      target-s3-bucket: ${{ secrets.NVIDIA_DOCS_S3_BUCKET }}
    uses: rapidsai/shared-workflows/.github/workflows/publish-api-docs.yaml@main
    with:
      docs-projects: rmm,librmm
      dry-run: true
  wheel-build-cpp:
    needs: [build-details, checks]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      matrix_filter: group_by([.ARCH, (.CUDA_VER|split(".")|map(tonumber)|.[0])]) | map(max_by(.PY_VER|split(".")|map(tonumber)))
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu8
      script: ci/build_wheel_cpp.sh
      package-name: librmm
      package-type: cpp
  wheel-build-python:
    needs: [build-details, wheel-build-cpp]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      # Build a wheel for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu8
      script: ci/build_wheel_python.sh
      package-name: rmm
      package-type: python
  wheel-tests:
    needs: [wheel-build-python, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_wheels
    with:
      build_type: pull-request
      script: ci/test_wheel.sh
  wheel-tests-integration-optional:
    needs: [wheel-build-python, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_wheels
    with:
      build_type: pull-request
      script: ci/test_wheel_integrations.sh
  devcontainer:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    needs:
      - telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/build-in-devcontainer.yaml@main
    with:
      arch: '["amd64", "arm64"]'
      cuda: '["13.3"]'
      node_type: "cpu8"
      env: |
        SCCACHE_DIST_MAX_RETRIES=inf
        SCCACHE_SERVER_LOG=sccache=debug
        SCCACHE_DIST_FALLBACK_TO_LOCAL_COMPILE=false
      build_command: |
        sccache --zero-stats;
        build-all -j0 -DBUILD_BENCHMARKS=ON --verbose 2>&1 | tee telemetry-artifacts/build.log;
        sccache --show-adv-stats | tee telemetry-artifacts/sccache-stats.txt;
  telemetry-summarize:
    # This job must use a self-hosted runner to record telemetry traces.
    runs-on: linux-amd64-cpu4
    permissions:
      actions: write
    needs: pr-builder
    if: false
    continue-on-error: true
    steps:
      - name: Telemetry summarize
        uses: rapidsai/shared-actions/telemetry-dispatch-summarize@main
    env:
      GH_TOKEN: ${{ github.token }}
  disk-range-probe:
    runs-on: "linux-amd64-cpu8"
    env:
      REPO: rapidsai/ci-wheel
      TAG: 26.12-cuda13.3.0-rockylinux8-py3.13-amd64
    steps:
      - name: Probe open-ended ranges and disk throughput
        run: |
          set +e -uo pipefail
          mirror=$(docker info --format '{{range .RegistryConfig.Mirrors}}{{.}}{{end}}')
          mirror=${mirror%/}
          hub=https://registry-1.docker.io
          token=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPO}:pull" | jq -r .token)
          accept='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          auth=()
          section() { echo; echo "===== $*"; }
          timed() {
            local start end
            start=$(date +%s.%N)
            "$@"
            end=$(date +%s.%N)
            awk -v s="$start" -v e="$end" 'BEGIN { printf "elapsed: %.1fs\n", e - s }'
          }
          headers() { grep -i -E '^(HTTP|content-length|content-range|accept-ranges|location)'; }

          manifest=$(curl -sS -H "Accept: ${accept}" "${mirror}/v2/${REPO}/manifests/${TAG}")
          if ! jq -e .layers >/dev/null 2>&1 <<<"$manifest"; then
            echo "mirror manifest request failed, retrying with Docker Hub token"
            auth=(-H "Authorization: Bearer ${token}")
            manifest=$(curl -sS -H "Accept: ${accept}" "${auth[@]}" "${mirror}/v2/${REPO}/manifests/${TAG}")
          fi
          read -r size digest < <(jq -r '.layers | max_by(.size) | "\(.size) \(.digest)"' <<<"$manifest")
          mid=$((size / 2))
          blob="/v2/${REPO}/blobs/${digest}"
          echo "probe blob: ${digest} (${size} bytes)"

          section "mirror GET Range: bytes=0-"
          curl -s -o /dev/null -D - -r 0- --max-time 3 "${auth[@]}" "${mirror}${blob}" | headers
          section "mirror GET Range: bytes=${mid}-"
          curl -s -o /dev/null -D - -r "${mid}-" --max-time 3 "${auth[@]}" "${mirror}${blob}" | headers
          section "Docker Hub GET Range: bytes=0-, following redirects (reference)"
          curl -s -o /dev/null -D - -L -r 0- --max-time 3 -H "Authorization: Bearer ${token}" "${hub}${blob}" | headers

          root=$(sudo containerd config dump | awk -F"'" '/^root = /{print $2}')
          root=${root:-/var/lib/containerd}
          command -v zstd >/dev/null || sudo apt-get install -y -q zstd >/dev/null
          dir="${root}/probe"
          sudo mkdir -p "$dir"
          section "runner: $(nproc) CPUs, containerd root ${root}"
          free -g
          findmnt -T "$root"
          df -h "$root"
          lsblk -o NAME,SIZE,TYPE,ROTA,MOUNTPOINTS

          section "dd 4 GiB, O_DIRECT"
          sudo dd if=/dev/zero of="${dir}/dd" bs=1M count=4096 oflag=direct 2>&1 | grep -v records
          sudo rm -f "${dir}/dd"
          section "dd 4 GiB, fdatasync"
          sudo dd if=/dev/zero of="${dir}/dd" bs=1M count=4096 conv=fdatasync 2>&1 | grep -v records
          sudo rm -f "${dir}/dd"

          section "mirror blob to disk"
          sudo curl -sS -o "${dir}/blob" "${auth[@]}" "${mirror}${blob}" -w '%{http_code} %{size_download} bytes, %{speed_download} B/s\n'
          section "sync after download"
          timed sync
          section "sha256sum"
          timed sudo sha256sum "${dir}/blob"
          section "zstd decompress to /dev/null"
          timed bash -c "sudo zstd -q -d -c '${dir}/blob' > /dev/null"
          section "zstd decompress + tar extract to disk"
          sudo mkdir -p "${dir}/rootfs"
          timed bash -c "sudo zstd -d -c '${dir}/blob' | sudo tar -x -C '${dir}/rootfs'"
          section "sync after extract"
          timed sync
          sudo du -sh "${dir}/rootfs"
          sudo rm -rf "$dir"
          exit 0
